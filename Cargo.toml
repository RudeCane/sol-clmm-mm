[package]
name = "sol-clmm-mm"
version = "0.1.0"
edition = "2021"
description = "Self-hosted concentrated-liquidity market maker for Solana (Orca / Raydium) with a local web dashboard"
license = "MIT"

[features]
# Default build = simulator. The lightweight Solana v3 type crates
# (pubkey/keypair/signer) are always present for config + venue structs, but the
# heavy RPC client + Orca SDK are pulled only with --features orca.
default = []
orca = ["dep:orca_whirlpools", "dep:orca_whirlpools_core", "dep:solana-client", "dep:solana-instruction", "dep:solana-message", "dep:solana-transaction"]
raydium = ["dep:solana-clmm-raydium", "dep:solana-client"]

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
futures-util = "0.3"

# Web server + websocket (local dashboard)
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Errors / logging / time
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
rust_decimal = "1"

# ---- Solana v3 base types (always on) ----
# Lightweight, no full validator deps. Used by config.rs + venue structs.
# NOTE: v3 removed Keypair::from_bytes; we use Keypair::try_from(&[u8]).
solana-pubkey  = "3"
solana-keypair = "3"
solana-signer  = "3"

# ---- Orca-path heavy deps (optional) ----
orca_whirlpools      = { version = "8.0.0", optional = true }
orca_whirlpools_core = { version = "2.1",   optional = true }
solana-client        = { version = "3",     optional = true }
solana-instruction   = { version = "3",     optional = true }
solana-message       = { version = "3",     optional = true }
solana-transaction   = { version = "3",     optional = true }

# ---- Raydium-path deps (optional) ----
# Pure-math crate (no RPC/Anchor) + the shared RPC client.
solana-clmm-raydium  = { version = "0.3",   optional = true }

# ===========================================================================
# VERSION NOTE
# Entire crate is on Solana v3 split crates. orca_whirlpools 8.0.0 also targets
# v3, so --features orca is now version-consistent. If cargo reports a
# transitive solana-program/anchor conflict on first build, apply the lockfile
# patch from the orca docs:
#   cargo update solana-program:<current> --precise <required>
# (patch anchor first, then solana-program, if both complain).
# ===========================================================================
