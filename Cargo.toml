[package]
name = "sol-clmm-mm"
version = "0.1.0"
edition = "2021"
description = "Self-hosted concentrated-liquidity market maker for Solana (Orca / Raydium) with a local web dashboard"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
futures-util = "0.3"

# Web server + websocket (local dashboard)
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Solana
solana-client = "2.0"
solana-sdk = "2.0"

# Errors / logging / time
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
rust_decimal = "1"

# NOTE: venue SDK crates (orca_whirlpools / raydium) are intentionally NOT pinned here.
# See src/venues/README and the "Wiring real SDKs" section of README.md — the
# scaffold ships with a working SimulatedVenue so you can run the full loop and UI
# today, then drop the real SDK behind the same trait.
