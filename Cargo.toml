[package]
name = "sol-clmm-mm"
version = "0.1.0"
edition = "2021"
description = "Self-hosted concentrated-liquidity market maker for Solana (Orca / Raydium) with a local web dashboard"
license = "MIT"

[features]
# Default build is the SIMULATOR ONLY — no SDK, no Solana RPC crates, compiles
# fast and clean. Real venues are opt-in because they pull heavy, version-
# sensitive dependency trees.
default = []
# Orca pulls in orca_whirlpools 8.0.0 which REQUIRES Solana v3 crates. Enabling
# this will conflict with the solana 2.0 pins below — see the note at the bottom
# of this file. Build with: cargo build --features orca
orca = ["dep:orca_whirlpools", "dep:orca_whirlpools_core", "dep:solana-client", "dep:solana-pubkey", "dep:solana-keypair"]
raydium = []

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
futures-util = "0.3"

# Web server + websocket (local dashboard)
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Errors / logging / time
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
rust_decimal = "1"

# ---- Simulator-path Solana types (v2) ----
# Used by config.rs + raydium stub for Pubkey/Keypair when NOT building --features orca.
solana-sdk = "2.0"

# ---- Orca-path deps (optional, v3) ----
# Only compiled with --features orca.
orca_whirlpools      = { version = "8.0.0", optional = true }
orca_whirlpools_core = { version = "2.1",   optional = true }
solana-client  = { version = "3", optional = true }
solana-pubkey  = { version = "3", optional = true }
solana-keypair = { version = "3", optional = true }

# ===========================================================================
# DEPENDENCY VERSION NOTE — READ BEFORE `cargo build --features orca`
# ===========================================================================
# orca_whirlpools 8.0.0 depends on the Solana *v3* split crates (solana-client
# ^3, solana-pubkey ^3, solana-keypair ^3, ...). The simulator/raydium path
# above pins solana-sdk = "2.0". You CANNOT have both v2 and v3 of the Solana
# crates in one build.
#
# To build the real Orca path you must migrate the whole crate to Solana v3:
#   1. Remove `solana-sdk = "2.0"`.
#   2. Replace solana_sdk::pubkey::Pubkey   -> solana_pubkey::Pubkey
#      and    solana_sdk::signature::Keypair -> solana_keypair::Keypair
#      in src/config.rs and src/venues/raydium.rs.
#   3. Make solana-pubkey / solana-keypair non-optional (or part of default).
#   4. `cargo update` and resolve any transitive pins (see orca_whirlpools_docs
#      note about `cargo update solana-program:<v> --precise <v>`).
#
# The simulator (default build, no features) is unaffected and compiles today.
# ===========================================================================
